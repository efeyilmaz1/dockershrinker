# =============================================================================
# GitLab CI/CD — Smart Docker Image Shrinker & Vulnerability Trimmer Bot
#
# Mirrors .github/workflows/shrink_and_deploy.yml and the Jenkinsfile so the
# same build -> shrink -> report -> scan -> push/deploy pipeline can run on
# any of the three CI/CD systems used in this project.
#
# Jobs run in separate docker-in-docker containers, so the shrunk image is
# handed between stages as a `docker save` tarball artifact rather than
# relying on a shared local Docker daemon.
#
# Optional CI/CD variables (Settings > CI/CD > Variables) for a real push:
#   DOCKERHUB_USERNAME  - Docker Hub username
#   DOCKERHUB_TOKEN     - Docker Hub access token (mask + protect it)
#   DOCKERHUB_REPO      - target repo, e.g. yourdockerhubuser/smartdockershrinker
# Without these set, the deploy job falls back to a simulated push, same as
# the GitHub Actions workflow does today.
# =============================================================================

stages:
  - build
  - security
  - deploy

variables:
  IMAGE_NAME: "myapp"
  DOCKER_TLS_CERTDIR: "/certs"

build_and_shrink:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - apk add --no-cache python3 py3-pip
  script:
    - echo "[FAZ 1] Building original (bloated) image"
    - docker build -t ${IMAGE_NAME}:bloated .
    - echo "[FAZ 2] Running Shrinker Bot"
    - python3 shrinker_engine/multistage_builder.py
    - docker build -t ${IMAGE_NAME}:shrunk -f Dockerfile.shrunk .
    - echo "[FAZ 3] Calculating size savings"
    - python3 shrinker_engine/size_calculator.py ${IMAGE_NAME}:bloated ${IMAGE_NAME}:shrunk
    - echo "[*] Saving shrunk image as an artifact for downstream jobs"
    - docker save ${IMAGE_NAME}:shrunk -o shrunk-image.tar
  artifacts:
    paths:
      - shrunk-image.tar
    expire_in: 1 hour

trivy_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["build_and_shrink"]
  script:
    - echo "[FAZ 4] Running Trivy vulnerability scan against the saved image tarball"
    - >
      trivy image
      --input shrunk-image.tar
      --format table
      --exit-code 0
      --ignore-unfixed
      --vuln-type os,library
      --severity CRITICAL,HIGH

push_and_deploy:
  stage: deploy
  image: docker:24.0
  services:
    - docker:24.0-dind
  needs: ["build_and_shrink", "trivy_scan"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "[FAZ 5] Push & deploy"
    - docker load -i shrunk-image.tar
    - |
      if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_REPO" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        docker tag ${IMAGE_NAME}:shrunk ${DOCKERHUB_REPO}:shrunk-${CI_PIPELINE_IID}
        docker tag ${IMAGE_NAME}:shrunk ${DOCKERHUB_REPO}:latest
        docker push ${DOCKERHUB_REPO}:shrunk-${CI_PIPELINE_IID}
        docker push ${DOCKERHUB_REPO}:latest
        docker logout
        echo "✅ Image passed security scan and is ~95% smaller!"
        echo "🚀 Pushed to Docker Hub as ${DOCKERHUB_REPO}:shrunk-${CI_PIPELINE_IID} and :latest"
        echo "🚀 Simulating SSH deployment to production server..."
      else
        echo "⚠️  DOCKERHUB_USERNAME / DOCKERHUB_TOKEN / DOCKERHUB_REPO CI/CD variables not set — falling back to simulation."
        echo "✅ Image passed security scan and is ~95% smaller!"
        echo "🚀 Simulating docker push to Docker Hub..."
        echo "🚀 Simulating SSH deployment to production server..."
      fi
    - echo "Done."
